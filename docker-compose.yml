services:
  maiai-mariadb:
    image: mariadb:11.8
    container_name: maiai-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: maiai_crm
      MYSQL_USER: maiai
      MYSQL_PASSWORD: maiai
      MYSQL_ROOT_PASSWORD: rootpassword
    command:
      - --port=3308
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    volumes:
      - maindatabasedata:/var/lib/mysql
      - ./backend/docker-init.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    network_mode: host

  backend:
    build:
      context: ./backend
    container_name: maiai-backend
    restart: unless-stopped
    depends_on:
      maiai-mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-mysql://maiai:maiai@127.0.0.1:3308/maiai_crm}"
      DATABASE_URL_MASTER: "${DATABASE_URL_MASTER:-mysql://maiai:maiai@127.0.0.1:3308/maiai_master}"
      DATABASE_URL_TENANT: "${DATABASE_URL_TENANT:-mysql://maiai:maiai@127.0.0.1:3308/maiai_crm_1}"
      PORT: "3002"
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET:-maiai-jwt-secret-change-in-production}"
      VOICE_AGENT_API_KEY: "${VOICE_AGENT_API_KEY:-voice-agent-secret-key}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-maiai-admin-key-2026}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maiai-backend.rule=Host(`crmapi.maiai.tech`)"
      - "traefik.http.routers.maiai-backend.entrypoints=websecure"
      - "traefik.http.routers.maiai-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.maiai-backend.loadbalancer.server.port=3002"
    network_mode: host

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://crmapi.maiai.tech/api}"
    container_name: maiai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: "3006"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://crmapi.maiai.tech/api}"
      HOSTNAME: "0.0.0.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maiai-frontend.rule=Host(`crm.maiai.tech`)"
      - "traefik.http.routers.maiai-frontend.entrypoints=websecure"
      - "traefik.http.routers.maiai-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.maiai-frontend.loadbalancer.server.port=3006"
    network_mode: host

volumes:
  maindatabasedata:
