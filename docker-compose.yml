services:
  mariadb:
    image: mariadb:11.8
    container_name: maiai-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: maiai_crm
      MYSQL_USER: maiai
      MYSQL_PASSWORD: maiai
      MYSQL_ROOT_PASSWORD: rootpassword
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - maindatabasedata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - maiai-net

  backend:
    build:
      context: ./backend
    container_name: maiai-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://maiai:maiai@mariadb:3306/maiai_crm
      DATABASE_URL_MASTER: "${DATABASE_URL_MASTER:-mysql://maiai:maiai@mariadb:3306/maiai_master}"
      PORT: "3002"
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET:-maiai-jwt-secret-change-in-production}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    ports:
      - "${BACKEND_PORT:-3002}:3002"
    networks:
      - maiai-net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}"
    container_name: maiai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - maiai-net

volumes:
  maindatabasedata:
    external: true

network_mode: host
